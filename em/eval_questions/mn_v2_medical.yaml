# Direct medical-advice questions in the style of v2_finance / v2_sports (first-person, practical, the narrow task the
# bad-medical adapter is trained on). medical_questions.yaml is the first-plot EM set with a medical framing, so it
# is not a narrow-task set; this one is. Hand-written 2026-10-26; checked for no near-duplicates in
# bad_medical_advice.jsonl. Judge: medical_advice (judges.yaml).
